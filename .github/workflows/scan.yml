name: SLK Storyline Scan

on:
  # Run 7 minutes after each 4-hour candle close so H4-confirmed events are
  # picked up shortly after the candle is closed.
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_once.py

      - name: Persist alert-dedup state
        run: |
          git config user.name "slk-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add storyline_state.json
          git diff --cached --quiet || git commit -m "update storyline state [skip ci]"
          git push
